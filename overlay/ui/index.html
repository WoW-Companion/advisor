<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Companion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="panel" id="panel">
  <header class="titlebar" data-tauri-drag-region>
    <h1 data-tauri-drag-region><span class="wow">WoW </span>Companion</h1>
    <span id="ct" class="ct" hidden role="img" aria-label="Click-through on" title="Click-through on (Ctrl+Shift+T)">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 2.5l8 5.2-3.4.9 2 3.6-1.5.9-2-3.6L5 11.5z" fill="currentColor"/><path d="M1.5 1.5l13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
    <button id="settings-btn" type="button" title="Settings" aria-label="Settings">&#9881;</button>
    <button id="mode" type="button" data-mode="overlay" aria-label="Overlay mode" title="Overlay mode: always on top (click for Window)">
      <svg class="i-overlay" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M9.5 1.5l5 5-1.2 1.2-.9-.4-2.4 2.4.1 2.1-1.2 1.2L6.4 9.9 2.7 13.6 2 13l3.7-3.7L2.9 6.5 4.1 5.3l2.1.1 2.4-2.4-.4-.9z" fill="currentColor"/></svg>
      <svg class="i-window" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button id="tray" type="button" title="Hide to tray" aria-label="Hide to tray">&#8211;</button>
    <button id="close" type="button" title="Quit" aria-label="Quit">&#215;</button>
  </header>

  <div id="banner" class="banner" hidden>
    <span id="banner-text"></span>
    <button id="retry" type="button">Reconnect</button>
  </div>
  <div id="status" class="notice calm" role="status" hidden></div>
  <div id="aibar" class="notice calm" hidden>
    Answers need an AI client. Install
    <a href="#" data-page="https://docs.claude.com/en/docs/claude-code/setup">Claude Code</a>,
    <a href="#" data-page="https://github.com/openai/codex">Codex</a> or
    <a href="#" data-page="https://github.com/google-gemini/gemini-cli">Gemini CLI</a>.
  </div>
  <div id="notice" class="notice" hidden></div>

  <section id="settings" class="settings" hidden>
    <label>Opacity <input id="opacity" type="range" min="0" max="100" step="5"> <output id="opacity-out"></output></label>
    <label>Solid on hover <input id="solid-hover" type="checkbox"></label>
    <label>AI client
      <select id="agent">
        <option value="auto">Auto</option>
        <option value="claude">Claude</option>
        <option value="codex">Codex</option>
        <option value="gemini">Gemini</option>
        <option value="custom">Custom command</option>
      </select>
      <button id="agent-rescan" type="button" title="Look for installed AI clients again">Re-scan</button>
    </label>
    <label id="agent-cmd-row" hidden>Command <input id="agent-cmd" placeholder="my-agent --flag"></label>
    <label>Keep in-game advice up to date <input id="auto-digest" type="checkbox"> <span id="auto-digest-note"></span></label>
    <label>Show / hide <input id="key-vis" class="key" readonly></label>
    <label>Click-through <input id="key-ct" class="key" readonly></label>
    <label>Check for updates <input id="check-updates" type="checkbox"></label>
    <label>Text size
      <select id="size"><option value="S">Small</option><option value="M">Medium</option><option value="L">Large</option></select>
    </label>
    <small>Opacity fades only the panel background. At 0% with click-through on, bring the panel back with the show/hide shortcut or the tray icon.</small>
    <small id="version" class="version"></small>
    <small>Focus a shortcut box and press the new keys (with Ctrl, Shift or Alt).</small>
  </section>

  <div class="bar">
    <select id="who" aria-label="Character"></select>
    <span id="badge" class="chip" title="data from game: …">…</span>
    <button id="clear" class="tiny" type="button" title="Clear the chat">Clear</button>
    <button id="chat-toggle" class="tiny" type="button" aria-expanded="true" title="Collapse the chat">&#9662;</button>
  </div>

  <section id="next" class="next">
    <button id="next-head" class="next-head" type="button" aria-expanded="true"><b>Next</b><span id="next-line"></span></button>
    <ol id="next-list"></ol>
  </section>

  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="text" maxlength="1000" rows="1" placeholder="Ask about this character…"></textarea>
    <button id="send">Ask</button>
  </form>
  <div id="grip" class="grip" title="Resize"></div>
</main>
<script src="app.js"></script>
</body>
</html>
