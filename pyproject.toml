[project]
name = "wowc-advisor"
version = "0.1.0"
description = "WoW Companion advisor: an MCP server for character-aware World of Warcraft advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WoW Companion contributors" }]
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "duckdb"]

[project.scripts]
wowc-advisor = "wowc_advisor.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowc_advisor"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
