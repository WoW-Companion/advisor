# Builds the WoW Companion overlay app (Tauri v2) with the Go advisor as its sidecar, and keeps the
# result as workflow artifacts. It publishes nothing. No macOS job yet: the app is Windows-first.
name: overlay

on:
  pull_request:
    paths: ["overlay/**", "cmd/**", "internal/**", ".github/workflows/overlay.yml"]
  push:
    paths: ["overlay/**", "cmd/**", "internal/**", ".github/workflows/overlay.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-tauri.exe
            overlay/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('overlay/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the Go advisor sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p overlay/src-tauri/binaries
          go build -trimpath -o overlay/src-tauri/binaries/wowc-advisor-x86_64-pc-windows-msvc.exe ./cmd/wowc-advisor

      - name: Install the Tauri CLI
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Build the app and the NSIS installer
        working-directory: overlay/src-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-companion-installer
          path: overlay/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wow-companion-exe
          path: |
            overlay/src-tauri/target/x86_64-pc-windows-msvc/release/wow-companion.exe
            overlay/src-tauri/target/x86_64-pc-windows-msvc/release/wowc-advisor.exe
          if-no-files-found: error
          retention-days: 14
